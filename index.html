<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>하늘소망교회 전자 기부금 영수증 신청</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>
            하늘소망교회<br>
            전자 기부금 영수증 신청
        </h1>

        <form id="donationForm">

            <div class="form-group">
                <label for="name">1. 성함</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="성함을 입력하세요"
                    required>
            </div>

           <div class="form-group">
            <label for="ssn">2. 주민등록번호</label>
            <input
                type="text"
                id="ssn"
                name="ssn"
                maxlength="14"
                placeholder="예) 900101-1234567"
                required>

            <small id="ssnMessage"></small>
        </div>

        <div class="form-group">
            <label for="phone">3. 전화번호</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                maxlength="13"
                placeholder="예) 010-1234-5678"
                required>

            <small id="phoneMessage"></small>
        </div>
            <div class="form-group">
                <label for="area">구역</label>
                <select id="area" name="area" required>
                    <option value="" disabled selected>구역을 선택하세요</option>
                    <option value="구리교문">구리교문</option>
                    <option value="구리인창">구리인창</option>
                    <option value="다산1">다산1</option>
                    <option value="다산2">다산2</option>
                    <option value="다산가운">다산가운</option>
                    <option value="다산도농">다산도농</option>
                    <option value="다산지금">다산지금</option>
                    <option value="금강">금강</option>
                    <option value="신성GS">신성GS</option>
                    <option value="진안">진안</option>
                    <option value="동림">동림</option>
                    <option value="별내">별내</option>
                    <option value="퇴계원">퇴계원</option>
                    <option value="서울">서울</option>
                    <option value="금곡1">금곡1</option>
                    <option value="양곡1">양곡1</option>
                    <option value="양곡2">양곡2</option>
                    <option value="호평1">호평1</option>
                    <option value="호평2">호평2</option>
                    <option value="호평3">호평3</option>
                    <option value="호평4">호평4</option>
                    <option value="호평5">호평5</option>
                    <option value="평내1">평내1</option>
                    <option value="평내2">평내2</option>
                    <option value="평내3">평내3</option>
                    <option value="평내4">평내4</option>
                    <option value="평내5">평내5</option>
                    <option value="평내6">평내6</option>
                    <option value="마석1">마석1</option>
                    <option value="마석2">마석2</option>
                    <option value="교역자">교역자</option>
                </select>
            </div>

            <div class="agreement">
                <p>
                    전자기부금영수증 발급을 위하여 개인정보를 수집·이용합니다.
                </p>
                <p>
                    수집항목 : 성명, 주민등록번호, 전화번호, 구역
                </p>
                <p>
                    수집목적 : 전자기부금영수증 발급
                </p>
            </div>

            <div class="checkbox-group">
                <input
                    type="checkbox"
                    id="agree"
                    required>

                <label for="agree">
                    개인정보 수집 및 이용에 동의합니다.
                </label>
            </div>

            <button type="submit">
                신청하기
            </button>

        </form>

    </div>

    <script src="script.js"></script>
</body>
</html>
